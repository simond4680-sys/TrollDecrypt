name: Build TrollDecrypt

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ${{ github.workspace }}/theos

      - name: Install dependencies
        run: |
          brew install ldid

      - name: Setup iOS SDK with private frameworks
        run: |
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Xcode SDK Version: $SDK_VERSION"
          echo "Xcode SDK Path: $SDK_PATH"

          mkdir -p ${{ github.workspace }}/theos/sdks
          THEOS_SDK=${{ github.workspace }}/theos/sdks/iPhoneOS${SDK_VERSION}.sdk

          echo "Copying Xcode SDK..."
          ditto "$SDK_PATH" "$THEOS_SDK"

          echo "Downloading theos/sdks 16.5 for private frameworks..."
          cd ${{ github.workspace }}/theos/sdks
          curl -L -o iPhoneOS16.5.sdk.tar.xz \
            "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"
          tar xf iPhoneOS16.5.sdk.tar.xz

          echo "Merging private frameworks from 16.5 SDK..."
          cp -R iPhoneOS16.5.sdk/System/Library/PrivateFrameworks \
            "$THEOS_SDK/System/Library/PrivateFrameworks" 2>/dev/null || true
          cp -R iPhoneOS16.5.sdk/usr/lib/libMobileGestalt* \
            "$THEOS_SDK/usr/lib/" 2>/dev/null || true

          rm -rf iPhoneOS16.5.sdk
          echo "Private frameworks merged:"
          ls "$THEOS_SDK/System/Library/PrivateFrameworks/" | head -10

          echo "SDK_VERSION=$SDK_VERSION" >> $GITHUB_ENV

      - name: Build
        run: |
          export THEOS=${{ github.workspace }}/theos
          export PATH="$THEOS/bin:$PATH"
          make clean all package FINALPACKAGE=1 \
            "TARGET=iphone:clang:${SDK_VERSION}:14.0"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollDecrypt-iOS${{ env.SDK_VERSION }}
          path: ./*.tipa
          if-no-files-found: error
