name: Build TrollDecrypt

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ${{ github.workspace }}/theos

      - name: Get iOS SDK from Xcode
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using SDK at: $SDK_PATH"
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "SDK Version: $SDK_VERSION"
          THEOS_SDK=${{ github.workspace }}/theos/sdks/iPhoneOS${SDK_VERSION}.sdk
          cp -R "$SDK_PATH" "$THEOS_SDK"
          echo "SDK copied to: $THEOS_SDK"

      - name: Build
        run: |
          export THEOS=${{ github.workspace }}/theos
          export PATH="$THEOS/bin:$PATH"
          make package FINALPACKAGE=1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollDecrypt
          path: ./*.tipa
          if-no-files-found: error
