name: Build TrollDecrypt

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ${{ github.workspace }}/theos

      - name: Install dependencies
        run: |
          brew install ldid

      - name: Download iOS SDK
        run: |
          mkdir -p ${{ github.workspace }}/theos/sdks
          cd ${{ github.workspace }}/theos/sdks
          curl -L -o iPhoneOS16.5.sdk.tar.xz \
            "https://github.com/theos/sdks/releases/download/master/iPhoneOS16.5.sdk.tar.xz"
          tar xf iPhoneOS16.5.sdk.tar.xz
          rm iPhoneOS16.5.sdk.tar.xz
          ls -la

      - name: Build
        run: |
          export THEOS=${{ github.workspace }}/theos
          export PATH="$THEOS/bin:$PATH"
          make clean all package FINALPACKAGE=1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollDecrypt
          path: ./*.tipa
          if-no-files-found: error
