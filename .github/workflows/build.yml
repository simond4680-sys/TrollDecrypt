name: Build TrollDecrypt

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ${{ github.workspace }}/theos

      - name: Download iPhoneOS SDK
        run: |
          mkdir -p ${{ github.workspace }}/theos/sdks
          curl -L -o ${{ github.workspace }}/theos/sdks/iPhoneOS16.5.sdk.zip \
            "https://github.com/theos/sdks/raw/master/iPhoneOS16.5.sdk.zip"
          cd ${{ github.workspace }}/theos/sdks
          unzip -q iPhoneOS16.5.sdk.zip

      - name: Build
        run: |
          export THEOS=${{ github.workspace }}/theos
          export PATH="$THEOS/bin:$PATH"
          make package FINALPACKAGE=1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollDecrypt
          path: ./*.tipa
          if-no-files-found: error
